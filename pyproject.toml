requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "tiktoken>=0.7.0",
]

[dependency-groups]
dev = [
    "locust>=2.0.0",
]
